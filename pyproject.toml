[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freedeobf"
version = "0.1.0"
description = "Offline, extensible source deobfuscation toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
freedeobf = "freedeobf.cli:main"

[tool.setuptools.packages.find]
include = ["freedeobf*"]
